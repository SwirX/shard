name: CI

on:
  push:
    branches: [nightly, main]
    tags: ["v*"]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  check:
    name: check (${{ matrix.toolchain }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        toolchain: [nightly, stable]
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ matrix.toolchain }}
          components: clippy, rustfmt
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Lint
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo test --all-targets

  release:
    name: release (${{ matrix.target }})
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            cargo_args: ""
          - target: x86_64-unknown-linux-musl
            cargo_args: "--target x86_64-unknown-linux-musl"
          - target: aarch64-unknown-linux-gnu
            cargo_args: "--target aarch64-unknown-linux-gnu"
    steps:
      - uses: actions/checkout@v4
      - name: Install cross toolchain dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools gcc-aarch64-linux-gnu libc6-dev-arm64-cross
      - name: Install toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - name: Configure aarch64 linker
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Build release
        run: cargo build --release ${{ matrix.cargo_args }}
      - name: Rename binary
        run: cp target/${{ matrix.target }}/release/shard target/shard-${{ matrix.target }} 2>/dev/null || cp target/release/shard target/shard-${{ matrix.target }}
      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          files: target/shard-*
          fail_on_unmatched_files: true