[workspace]
resolver = "2"
members = [
    "crates/shard-core",
    "crates/shard-cli",
    "crates/shard-rpc",
    "crates/shard-socket",
    "crates/shard-daemon",
    "crates/shard-client",
    "crates/shard-native-host",
]

[workspace.package]
version = "1.1.0"
edition = "2024"
license = "MIT"
authors = ["SwirX <swirxytb@gmail.com>"]

[workspace.dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "io-util", "sync", "time", "process", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = "thin"
codegen-units = 1